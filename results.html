<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نتايج استبيان القلق — لايف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1d2430; --muted:#646f7e;
    --line:#e3e1dc; --accent:#2f6f6b; --accent-soft:#e5efee;
    --lv1:#4c8c7b; --lv2:#8aa13f; --lv3:#d39434; --lv4:#c4635a;
    --radius:16px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171c; --card:#1c2027; --ink:#edeef0; --muted:#9aa4b2;
      --line:#2b3039; --accent:#5fb5ab; --accent-soft:#223232;
      --lv1:#5fb5ab; --lv2:#a8bf5c; --lv3:#e0a84f; --lv4:#e0817a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171c; --card:#1c2027; --ink:#edeef0; --muted:#9aa4b2;
    --line:#2b3039; --accent:#5fb5ab; --accent-soft:#223232;
    --lv1:#5fb5ab; --lv2:#a8bf5c; --lv3:#e0a84f; --lv4:#e0817a;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Cairo","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
    font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px 56px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:14px}
  h1{font-size:1.4rem; margin:0 0 4px}
  h2{font-size:1.12rem; margin:0 0 10px}
  h3{font-size:.98rem; margin:22px 0 8px; color:var(--muted); font-weight:600}
  p{margin:0 0 12px}
  .sub{color:var(--muted); font-size:.92rem}
  .dot{display:inline-block; width:8px; height:8px; border-radius:99px; background:var(--lv1); margin-inline-end:6px; vertical-align:middle}
  .row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:.92rem}
  .row .lbl{flex:0 0 42%; color:var(--muted)}
  .row .track{flex:1; height:16px; background:var(--line); border-radius:6px; overflow:hidden}
  .row .track > i{display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .3s}
  .row .val{flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--muted); min-width:62px; text-align:left}
  .stat{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px}
  .stat > div{flex:1 1 42%; background:var(--accent-soft); border-radius:12px; padding:12px 14px}
  .stat b{display:block; font-size:1.8rem; line-height:1.3}
  .qstat{border-top:1px solid var(--line); padding-top:14px; margin-top:14px}
  .qstat:first-of-type{border-top:none; padding-top:0; margin-top:0}
  .qstat .title{font-weight:600; margin-bottom:10px; font-size:.97rem}
  ul{margin:0 0 12px; padding-inline-start:20px}
  li{margin-bottom:6px}
  button{font-family:inherit; font-size:1rem; cursor:pointer}
  .btn{display:block; width:100%; padding:12px 18px; border-radius:12px; border:1px solid var(--accent);
       background:transparent; color:var(--accent); font-weight:600; margin-top:8px}
  .err{border:1px solid var(--lv4); border-radius:12px; padding:14px 16px; font-size:.92rem; margin-bottom:14px}
  .ft{text-align:center; color:var(--muted); font-size:.82rem; margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>نتايج استبيان القلق</h1>
    <p class="sub"><span class="dot"></span><span id="liveNote">بحمّل النتايج…</span></p>
    <div id="errBox"></div>
    <div class="stat" id="topStats"></div>
    <h3>توزيع مستويات القلق</h3>
    <div id="levels"></div>
    <h3>الخلاصة</h3>
    <div id="conclusion"></div>
    <button class="btn" id="refresh">حدّث دلوقتي</button>
  </div>

  <div class="card">
    <h2>تفصيل كل موقف</h2>
    <p class="sub">عدد ونسبة اللي اختاروا كل إجابة.</p>
    <div id="perQ"></div>
  </div>

  <p class="ft">الأرقام مجمّعة ومجهولة · استبيان توعوي في خدمة الشباب</p>
</div>

<script>
(function(){
  "use strict";

  var Q = [
    { s:"فاضل أسبوع على امتحان أو تسليم مشروع مهم.", k:"الامتحانات والتسليمات",
      o:["بعمل خطة وببدأ","بتوتر وبعدين بركّز","بفضل مفكّر في الفشل وبأجّل","بتشلّ ومش بنام"] },
    { s:"مطلوب منك تتكلم قدام مجموعة.", k:"الكلام قدام الناس",
      o:["برتبك ثانيتين وبكمّل","بتوتر قبلها وبرتاح","بفكّر فيها أيام قبلها","باعتذر وبهرب"] },
    { s:"حد سألك عن مستقبلك بعد التخرّج.", k:"القلق من المستقبل",
      o:["عندي تصوّر وبهدوء","بضايق وبرجع لطبيعتي","قلق بيفضل باقي اليوم","ببعد عن الموضوع خالص"] },
    { s:"بعتّ رسالة لحد مهم وقراها ومردّش.", k:"الخوف من الرفض",
      o:["بفترض إنه مشغول","بستغرب وبنسى","براجع كلامي وبدوّر على غلطة","بتأكد إنه زعلان وتركيزي بيضيع"] },
    { s:"عملت غلطة بسيطة في الشغل أو المذاكرة.", k:"التعامل مع الغلط",
      o:["بصلّحها وبتعلّم","بضايق وبعدّيها","بلوم نفسي كام يوم","بعتبرها دليل إني فاشل"] },
    { s:"قبل النوم على طول.", k:"النوم والأفكار",
      o:["بنام ودماغي هادية","بفكّر دقايق وبنام","بفضل أراجع وبتأخر","النوم بقى معركة كل يوم"] },
    { s:"خفقان في القلب أو صداع متكرر.", k:"الأعراض الجسدية",
      o:["بربطها بالتعب","بتابع بهدوء","بدوّر على النت وبقلق","بتأكد إن عندي مرض خطير"] },
    { s:"إنجازات صحابك على السوشيال ميديا.", k:"المقارنة بالناس",
      o:["بفرحلهم وبكمّل","بقارن لحظة وبعدّي","بحس إني متأخر عن الكل","بضايق جداً وبمسح التطبيقات"] },
    { s:"حد من أهلك اتأخر ومش بيرد.", k:"الخوف على الأهل",
      o:["بستنى عادي","بقلق وبكلّمه تاني","خيالي بيرسم حاجات وحشة","بدخل في حالة رعب"] },
    { s:"قدامك قرار مهم.", k:"اتخاذ القرار",
      o:["بستشير وبقرّر","بتردد وبقرّر","بأجّل خوف من الغلط","مش بعرف أحسم خالص"] },
    { s:"إحساسك ناحية ربنا بعد الصلاة أو الاعتراف.", k:"العلاقة مع ربنا",
      o:["راحة وثقة في محبته","بريح ساعات وبتوتر ساعات","خايف إني مش مقبول","خايف من غضبه على طول"] },
    { s:"داخل مكان فيه ناس مش متعرّف عليهم.", k:"المواقف الاجتماعية",
      o:["بتعرّف بسهولة","برتبك وبعدين بندمج","بحس إن الكل بيحكم عليا","ببعد أو بمشي بدري"] },
    { s:"حد انتقدك قدام الناس.", k:"تقبّل النقد",
      o:["بسمع وباخد اللي فيه صح","بضايق وبستوعبه","بفضل مفكّر فيه وبتكسف","بنسحب من المكان أو الخدمة"] },
    { s:"التزاماتك اتراكمت فوق بعضها.", k:"ضغط الالتزامات",
      o:["برتّب أولوياتي","بتوتر وبشقّ طريقي","بحس إني بغرق وبهرب","بنهار أو بتعصّب"] },
    { s:"لما تحتاج مساعدة أو حد يسمعك.", k:"طلب المساعدة",
      o:["بطلبها بسهولة","بتردد وبطلبها","بفضل ساكت","بخبّي وبوري إني كويس"] }
  ];

  var LEVELS = [
    { name:"قلق قليل",  color:"var(--lv1)" },
    { name:"قلق خفيف",  color:"var(--lv2)" },
    { name:"قلق متوسط", color:"var(--lv3)" },
    { name:"قلق عالي",  color:"var(--lv4)" }
  ];

  var AR = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  function num(n){ return String(n).split("").map(function(c){ return (c>="0"&&c<="9")?AR[+c]:c; }).join(""); }
  function dec(x){ return num(x.toFixed(1)).replace(".","٫"); }
  function el(id){ return document.getElementById(id); }

  function apiError(status, code){
    if(code === "missing_env")
      return "السيرفر شغال بس متغيرات Supabase ناقصة. ضيفي SUPABASE_URL و SUPABASE_SERVICE_KEY في Environment Variables على Vercel واعملي Redeploy.";
    if(code === "read_failed")
      return "السيرفر مش عارف يوصل لقاعدة البيانات. اتأكدي من المفتاح (لازم service_role) ومن إن جدول responses موجود.";
    if(status === 404)
      return "مفيش /api شغال على اللينك ده. اتأكدي إن فولدر api اترفع على Vercel.";
    if(status === 0)
      return "مفيش اتصال بالسيرفر دلوقتي.";
    return "في مشكلة في تحميل النتايج (كود " + status + ").";
  }

  function bar(label, count, totalN, color){
    var pct = totalN ? Math.round(count/totalN*100) : 0;
    var row = document.createElement("div"); row.className = "row";
    var l = document.createElement("div"); l.className = "lbl"; l.textContent = label;
    var tr = document.createElement("div"); tr.className = "track";
    var fi = document.createElement("i"); fi.style.width = pct + "%";
    if(color) fi.style.background = color;
    tr.appendChild(fi);
    var v = document.createElement("div"); v.className = "val";
    v.textContent = num(count) + " · " + num(pct) + "٪";
    row.appendChild(l); row.appendChild(tr); row.appendChild(v);
    return row;
  }

  function stat(label, value){
    var d = document.createElement("div");
    var b = document.createElement("b"); b.textContent = value;
    var s = document.createElement("span"); s.className = "sub"; s.textContent = label;
    d.appendChild(b); d.appendChild(s); return d;
  }

  function render(agg){
    var n = agg.n || 0;
    var top = el("topStats"); top.textContent = "";

    if(n === 0){
      top.appendChild(stat("لسه محدش جاوب", "٠"));
      el("levels").textContent = "";
      el("conclusion").textContent = "الإحصائيات هتظهر هنا أول ما الشباب يبدأوا يجاوبوا، وبتتحدّث لوحدها.";
      el("perQ").textContent = "";
      return;
    }

    var lv = agg.levels || [0,0,0,0];
    var qc = agg.q || Q.map(function(){ return [0,0,0,0]; });
    var avg = (agg.sum || 0) / n;

    top.appendChild(stat("عدد اللي جاوبوا", num(n)));
    top.appendChild(stat("متوسط الدرجة من ٤٥", dec(avg)));

    var lb = el("levels"); lb.textContent = "";
    LEVELS.forEach(function(L, i){ lb.appendChild(bar(L.name, lv[i]||0, n, L.color)); });

    var high = (lv[2]||0) + (lv[3]||0);
    var pctHigh = Math.round(high/n*100);
    var avgQ = Q.map(function(q, i){
      var s = 0; for(var j=0;j<4;j++) s += qc[i][j]*j;
      return { k:q.k, avg:s/n };
    }).sort(function(a,b){ return b.avg - a.avg; });

    var c = el("conclusion"); c.textContent = "";
    var p1 = document.createElement("p");
    if(pctHigh >= 60)      p1.textContent = "معظم اللي جاوبوا (" + num(pctHigh) + "٪) في مستوى قلق متوسط أو عالي. المجموعة كلها تحت ضغط واضح، والموضوع يستاهل جلسة مشورة جماعية ومتابعة فردية لمين محتاج.";
    else if(pctHigh >= 35) p1.textContent = "حوالي " + num(pctHigh) + "٪ من اللي جاوبوا في مستوى قلق متوسط أو عالي. نسبة مش قليلة ومحتاجة اهتمام ومتابعة، رغم إن معظم المجموعة في الحدود الطبيعية.";
    else                   p1.textContent = "معظم اللي جاوبوا في مستوى قلق قليل أو خفيف، و" + num(pctHigh) + "٪ بس في المستويات الأعلى. الصورة العامة مطمّنة، مع الانتباه لمين في الطرف العالي.";
    c.appendChild(p1);

    var p2 = document.createElement("p");
    p2.textContent = "أكتر المواقف اللي بتقلق المجموعة:";
    c.appendChild(p2);
    var ul = document.createElement("ul");
    avgQ.slice(0,3).forEach(function(x){
      var li = document.createElement("li");
      li.textContent = x.k + " — متوسط " + dec(x.avg) + " من ٣";
      ul.appendChild(li);
    });
    c.appendChild(ul);
    var p3 = document.createElement("p");
    p3.className = "sub";
    p3.textContent = "أقل موقف بيقلقهم: " + avgQ[avgQ.length-1].k + ".";
    c.appendChild(p3);

    var pq = el("perQ"); pq.textContent = "";
    Q.forEach(function(q, i){
      var box = document.createElement("div"); box.className = "qstat";
      var t = document.createElement("div"); t.className = "title";
      t.textContent = num(i+1) + ". " + q.s;
      box.appendChild(t);
      q.o.forEach(function(txt, j){
        box.appendChild(bar(txt, qc[i][j], n, LEVELS[j].color));
      });
      pq.appendChild(box);
    });
  }

  function clock(){
    var d = new Date();
    return num(("0"+d.getHours()).slice(-2)) + ":" + num(("0"+d.getMinutes()).slice(-2));
  }

  function pull(){
    var st = 0;
    fetch("/api/stats", { cache: "no-store" })
      .then(function(r){
        st = r.status;
        return r.json().catch(function(){ return null; });
      })
      .then(function(d){
        if(st < 200 || st >= 300 || !d || d.error) throw (d && d.error) || "http";
        el("errBox").textContent = "";
        el("liveNote").textContent = "لايف · آخر تحديث " + clock();
        render(d);
      })
      .catch(function(code){
        el("liveNote").textContent = "التحديث واقف";
        var box = el("errBox");
        box.textContent = "";
        var e = document.createElement("div");
        e.className = "err";
        e.textContent = apiError(st, typeof code === "string" ? code : null);
        box.appendChild(e);
      });
  }

  el("refresh").addEventListener("click", pull);
  pull();
  setInterval(pull, 5000);
})();
</script>
</body>
</html>
